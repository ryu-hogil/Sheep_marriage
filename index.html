                                                                            const diff = Math.ceil((new Date(task.dueDate) - new Date()) / (1000 * 60 * 60 * 24));
                                                                            if (isNaN(diff)) return '';
                                                                            if (diff === 0) return 'D-Day';
                                                                            return diff > 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
                                                                        })()}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </td>

                                                        <td className="py-1.5 px-1.5 border-r border-slate-200" style={{ minWidth: `${Math.max(300, monthCount * 42)}px` }}>
                                                            <div 
                                                                className="grid gap-px bg-slate-200/80 rounded p-0.5 relative select-none"
                                                                style={{ gridTemplateColumns: `repeat(${monthCount}, minmax(40px, 1fr))` }}
                                                            >
                                                                {timelineMonths.map(m => {
                                                                    const isCurrentMonth = m.key === currentYearMonthKey;
                                                                    const isGaugeActive = (task.activeMonths || []).includes(m.key);

                                                                    return (
                                                                        <div
                                                                            key={m.key}
                                                                            onClick={() => handleMonthToggleGauge(task, m.key)}
                                                                            title={`${m.fullLabel} (클릭하여 선택/해제)`}
                                                                            className={`h-6 rounded-xs cursor-pointer transition-all flex items-center justify-center relative hover:opacity-80 ${
                                                                                isCurrentMonth ? 'bg-rose-100/60' : 'bg-white'
                                                                            }`}
                                                                        >
                                                                            {isCurrentMonth && (
                                                                                <div className="absolute top-0.5 right-0.5 w-1.5 h-1.5 rounded-full bg-rose-500 z-10"></div>
                                                                            )}

                                                                            {isGaugeActive && (
                                                                                <div className={`w-full h-4.5 flex items-center justify-center font-bold text-[9px] text-white transition-all rounded ${
                                                                                    task.status === '완료' ? 'bg-emerald-500' :
                                                                                    task.status === '긴급' ? 'bg-rose-500' :
                                                                                    task.status === '진행 중' ? 'bg-blue-500' :
                                                                                    'bg-slate-500'
                                                                                }`}>
                                                                                    <span className="px-0.5 truncate">{m.month}월</span>
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </td>

                                                        <td 
                                                            style={{ width: `${colWidths.budget}px`, minWidth: `${colWidths.budget}px` }}
                                                            className="py-1.5 px-2 border-r border-slate-200 text-right"
                                                        >
                                                            <input
                                                                type="text"
                                                                value={task.budget ? formatNumberWithCommas(task.budget) : ''}
                                                                onChange={(e) => {
                                                                    const cleanVal = e.target.value.replace(/,/g, '');
                                                                    const num = cleanVal ? parseInt(cleanVal.replace(/\D/g, ''), 10) : 0;
                                                                    handleUpdateTask(task.id, 'budget', isNaN(num) ? 0 : num);
                                                                }}
                                                                placeholder="0"
                                                                className="w-full bg-transparent text-right font-mono text-xs text-slate-800 font-semibold outline-none hover:bg-slate-100 focus:bg-white focus:ring-1 focus:ring-wedding-500 rounded px-1.5 py-0.5"
                                                            />
                                                            <span className="text-[10px] text-slate-400 block font-mono">
                                                                {formatWon(task.budget)}
                                                            </span>
                                                        </td>

                                                        <td 
                                                            style={{ width: `${colWidths.expense}px`, minWidth: `${colWidths.expense}px` }}
                                                            className="py-1.5 px-2 border-r border-slate-200 text-right"
                                                        >
                                                            <input
                                                                type="text"
                                                                value={task.expense || ''}
                                                                placeholder="예: 20,000 + 23,000"
                                                                onChange={(e) => {
                                                                    const formatted = formatNumberWithCommas(e.target.value);
                                                                    handleUpdateTask(task.id, 'expense', formatted);
                                                                }}
                                                                className="w-full bg-transparent text-right font-mono text-xs text-slate-800 font-semibold outline-none hover:bg-slate-100 focus:bg-white focus:ring-1 focus:ring-wedding-500 rounded px-1.5 py-0.5"
                                                            />
                                                            <div className="flex items-center justify-end gap-1 mt-0.5">
                                                                <span className="text-[10px] text-slate-500 font-mono">
                                                                    {formatWon(evaluatedExpense)}
                                                                </span>
                                                                {task.budget > 0 && (
                                                                    <span className={`text-[9px] font-mono px-1 rounded ${
                                                                        variance < 0 ? 'bg-rose-100 text-rose-700 font-bold' : 'text-emerald-600'
                                                                    }`}>
                                                                        {variance < 0 ? `초과 ${formatWon(Math.abs(variance))}` : `절감`}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </td>

                                                        <td 
                                                            style={{ width: `${colWidths.memo}px`, minWidth: `${colWidths.memo}px` }}
                                                            className="py-1.5 px-2 border-r border-slate-200 hover:bg-slate-100/60 transition-colors cursor-pointer group/memocell"
                                                            onDoubleClick={() => setMemoModalTaskId(task.id)}
                                                            title="더블클릭하여 사진 첨부 및 상세 메모 열기"
                                                        >
                                                            <div className="flex items-center gap-1">
                                                                <input
                                                                    type="text"
                                                                    value={task.memo || ''}
                                                                    placeholder="메모... (더블클릭: 사진/상세)"
                                                                    onDoubleClick={(e) => {
                                                                        e.stopPropagation();
                                                                        setMemoModalTaskId(task.id);
                                                                    }}
                                                                    onChange={(e) => handleUpdateTask(task.id, 'memo', e.target.value)}
                                                                    className="w-full bg-transparent text-xs text-slate-600 outline-none hover:bg-slate-100 focus:bg-white focus:ring-1 focus:ring-wedding-500 rounded px-1 py-0.5"
                                                                />

                                                                <div className="flex items-center gap-1 shrink-0">
                                                                    {(hasImages || hasDetail) && (
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => setMemoModalTaskId(task.id)}
                                                                            className="px-1.5 py-0.5 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-full text-[10px] font-bold text-rose-700 flex items-center gap-1 transition-transform active:scale-95"
                                                                        >
                                                                            {hasImages && <span>📷 {task.images.length}</span>}
                                                                            {hasDetail && <span>📝</span>}
                                                                        </button>
                                                                    )}
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => setMemoModalTaskId(task.id)}
                                                                        className="opacity-0 group-hover/memocell:opacity-100 p-0.5 text-slate-400 hover:text-wedding-700 hover:bg-slate-200 rounded transition-all"
                                                                        title="상세 모달 열기"
                                                                    >
                                                                        <Icon name="maximize-2" className="w-3 h-3" />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>

                                                        <td className="py-1.5 px-2 text-center relative w-[140px] min-w-[140px]">
                                                            <div className="flex items-center justify-center gap-1 w-full">
                                                                <div className="relative inline-block text-left flex-1 min-w-[85px]">
                                                                    <button
                                                                        onClick={() => setActiveStatusDropdown(activeStatusDropdown === task.id ? null : task.id)}
                                                                        className={`w-full px-2 py-0.5 rounded-full text-[10px] font-bold border flex items-center justify-between gap-0.5 transition-transform active:scale-95 ${statusInfo.color}`}
                                                                    >
                                                                        <span className="flex items-center gap-1 mx-auto whitespace-nowrap">
                                                                            <span className={`w-1.5 h-1.5 rounded-full ${statusInfo.dot}`}></span>
                                                                            {task.status}
                                                                        </span>
                                                                        <Icon name="chevron-down" className="w-3 h-3 opacity-60 shrink-0" />
                                                                    </button>

                                                                    {activeStatusDropdown === task.id && (
                                                                        <div className="absolute right-0 top-full mt-1 w-30 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-1 space-y-1">
                                                                            {Object.values(STATUSES).map(s => (
                                                                                <button
                                                                                    key={s.id}
                                                                                    onClick={() => {
                                                                                        handleUpdateTask(task.id, 'status', s.id);
                                                                                        setActiveStatusDropdown(null);
                                                                                    }}
                                                                                    className={`w-full text-left px-2 py-0.5 rounded text-xs font-semibold flex items-center justify-between transition-colors border ${s.color}`}
                                                                                >
                                                                                    <span className="flex items-center gap-1 whitespace-nowrap text-[11px]">
                                                                                        <span className={`w-1.5 h-1.5 rounded-full ${s.dot}`}></span>
                                                                                        {s.label}
                                                                                    </span>
                                                                                    {task.status === s.id && <Icon name="check" className="w-3 h-3" />}
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                    )}
                                                                </div>

                                                                <button
                                                                    onClick={() => handleDeleteTask(task.id)}
                                                                    className="p-1 hover:bg-rose-100 text-slate-400 hover:text-rose-600 rounded transition-colors shrink-0"
                                                                    title="행 삭제 (하위 업무 포함)"
                                                                >
                                                                    <Icon name="x" className="w-3.5 h-3.5" />
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>

                            <div className="bg-slate-50 p-2.5 px-4 border-t border-slate-200 flex flex-wrap items-center justify-between text-xs text-slate-500 gap-2 shrink-0 w-full">
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => handleAddTask(null, 1)}
                                        className="text-wedding-700 hover:text-wedding-800 font-bold flex items-center gap-1 bg-white border border-wedding-200 px-2.5 py-1 rounded-lg shadow-2xs hover:bg-rose-50/50 transition-all text-xs"
                                    >
                                        <Icon name="plus" className="w-3.5 h-3.5" />
                                        새 업무 추가
                                    </button>
                                    <span>총 {displayTasks.length}개 항목 표출 중</span>
                                </div>
                                <div className="flex items-center gap-4 font-mono text-[11px]">
                                    <span>상한액 합계: <strong className="text-slate-800">{formatWon(summaryData.totalBudget)}</strong></span>
                                    <span>지출액 합계: <strong className="text-amber-800">{formatWon(summaryData.totalExpense)}</strong></span>
                                </div>
                            </div>
                        </div>
                    </main>

                    {assigneeModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
                                <h3 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                                    <Icon name="user-plus" className="w-4 h-4 text-wedding-700" />
                                    새 담당자 추가
                                </h3>
                                <input
                                    type="text"
                                    value={newAssigneeName}
                                    onChange={(e) => setNewAssigneeName(e.target.value)}
                                    placeholder="담당자 이름 (예: 이모님, 플래너)"
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-wedding-500 mb-4"
                                    autoFocus
                                />
                                <div className="flex justify-end gap-2">
                                    <button
                                        onClick={() => setAssigneeModalOpen(false)}
                                        className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold"
                                    >
                                        취소
                                    </button>
                                    <button
                                        onClick={handleAddAssignee}
                                        className="px-3 py-1.5 bg-wedding-700 hover:bg-wedding-800 text-white rounded-xl text-xs font-semibold shadow-sm"
                                    >
                                        추가하기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeMemoTask && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-3 sm:p-6 overflow-y-auto">
                            <div className="bg-white rounded-2xl w-full max-w-3xl shadow-2xl border border-rose-100 flex flex-col max-h-[90vh] overflow-hidden my-auto animate-in fade-in zoom-in-95 duration-200">
                                
                                <div className="bg-gradient-to-r from-rose-900 via-wedding-700 to-amber-900 text-white p-4 sm:p-5 flex items-start justify-between">
                                    <div className="space-y-1 pr-4">
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <span className="bg-white/20 text-white text-[10px] font-mono px-2 py-0.5 rounded-full">
                                                Level {activeMemoTask.level}
                                            </span>
                                            <span className="bg-amber-400 text-slate-900 text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                담당: {activeMemoTask.assignee || '공동'}
                                            </span>
                                            <span className="bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                {activeMemoTask.status}
                                            </span>
                                        </div>
                                        <h2 className="text-lg sm:text-xl font-bold tracking-tight text-white flex items-center gap-2">
                                            📝 {activeMemoTask.title || '업무 상세 노트'}
                                        </h2>
                                        <p className="text-xs text-rose-100/80">
                                            업무와 관련된 사진, 계약서 스캔본, 요구사항 및 세부 메모를 기록하세요.
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setMemoModalTaskId(null)}
                                        className="text-white/80 hover:text-white hover:bg-white/10 p-1.5 rounded-xl transition-all shrink-0"
                                    >
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-4 sm:p-6 overflow-y-auto space-y-5 flex-1 bg-slate-50">
                                    <div className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs">
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                                            <Icon name="message-square" className="w-4 h-4 text-wedding-700" />
                                            요약 메모 (테이블 표출)
                                        </label>
                                        <input
                                            type="text"
                                            value={activeMemoTask.memo || ''}
                                            onChange={(e) => handleUpdateTask(activeMemoTask.id, 'memo', e.target.value)}
                                            placeholder="주요 내용을 간략히 입력하세요..."
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:bg-white focus:ring-2 focus:ring-wedding-500/50"
                                        />
                                    </div>

                                    <div className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs">
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                                            <Icon name="file-text" className="w-4 h-4 text-wedding-700" />
                                            상세 노트 및 특이사항
                                        </label>
                                        <textarea
                                            rows={5}
                                            value={activeMemoTask.detailMemo || ''}
                                            onChange={(e) => handleUpdateTask(activeMemoTask.id, 'detailMemo', e.target.value)}
                                            placeholder="업체 계좌번호, 담당자 연락처, 세부 전달사항, 체크리스트 등을 상세히 자유롭게 작성하세요..."
                                            className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs leading-relaxed outline-none focus:bg-white focus:ring-2 focus:ring-wedding-500/50 font-sans"
                                        ></textarea>
                                    </div>

                                    <div className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs">
                                        <div className="flex items-center justify-between mb-3">
                                            <label className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                                                <Icon name="image" className="w-4 h-4 text-wedding-700" />
                                                첨부 사진 & 참고 레퍼런스 (총 {activeMemoTask.images?.length || 0}장)
                                            </label>
                                            
                                            <button
                                                type="button"
                                                onClick={() => fileInputRef.current?.click()}
                                                className="px-3 py-1.5 bg-wedding-700 hover:bg-wedding-800 text-white rounded-lg text-xs font-bold shadow-sm transition-all flex items-center gap-1.5 active:scale-95"
                                            >
                                                <Icon name="upload-cloud" className="w-4 h-4" />
                                                사진 업로드
                                            </button>
                                            <input
                                                type="file"
                                                ref={fileInputRef}
                                                onChange={handleImageFilesUpload}
                                                accept="image/*"
                                                multiple
                                                className="hidden"
                                            />
                                        </div>

                                        {!activeMemoTask.images || activeMemoTask.images.length === 0 ? (
                                            <div 
                                                onClick={() => fileInputRef.current?.click()}
                                                className="border-2 border-dashed border-slate-200 hover:border-wedding-500 rounded-xl p-8 text-center bg-slate-50 hover:bg-rose-50/30 cursor-pointer transition-all"
                                            >
                                                <Icon name="camera" className="w-8 h-8 mx-auto text-slate-400 mb-2" />
                                                <p className="text-xs font-medium text-slate-600">
                                                    여기를 클릭하거나 드래그하여 사진을 첨부하세요
                                                </p>
                                                <p className="text-[11px] text-slate-400 mt-1">
                                                    (PNG, JPG, WEBP 지원 · 용량이 자동으로 안전하게 최적화됩니다)
                                                </p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                {activeMemoTask.images.map((img) => (
                                                    <div key={img.id} className="group relative rounded-xl border border-slate-200 overflow-hidden bg-slate-100 aspect-square shadow-2xs">
                                                        <img 
                                                            src={img.url} 
                                                            alt={img.name}
                                                            className="w-full h-full object-cover cursor-pointer hover:scale-105 transition-transform"
                                                        />
                                                        <button
                                                            type="button"
                                                            onClick={() => handleDeleteImage(activeMemoTask.id, img.id)}
                                                            className="absolute top-1.5 right-1.5 bg-slate-900/70 hover:bg-rose-600 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"
                                                            title="사진 삭제"
                                                        >
                                                            <Icon name="trash-2" className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="p-3.5 bg-white border-t border-slate-200 flex justify-end">
                                    <button
                                        onClick={() => setMemoModalTaskId(null)}
                                        className="px-4 py-2 bg-wedding-700 hover:bg-wedding-800 text-white rounded-xl text-xs font-semibold shadow-sm"
                                    >
                                        확인 및 닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>,
            document.getElementById('root')
        );
    </script>
</body>
</html>
