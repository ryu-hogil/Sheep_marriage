    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const Icon = React.memo(({ name, className = "w-4 h-4" }) => {
            const spanRef = useRef(null);

            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    try {
                        window.lucide.createIcons({
                            root: spanRef.current,
                            nameAttr: 'data-lucide',
                            attrs: { class: className }
                        });
                    } catch (e) {
                        console.error("Lucide icon creation error:", e);
                    }
                }
            }, [name, className]);

            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
        });

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught an error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-8 text-center bg-rose-50 min-h-screen flex flex-col items-center justify-center">
                            <h2 className="text-xl font-bold text-rose-800 mb-2">화면 처리 중 오류가 발생했습니다.</h2>
                            <p className="text-xs text-rose-600 mb-4">{this.state.error?.toString()}</p>
                            <button
                                onClick={() => window.location.reload()}
                                className="px-4 py-2 bg-rose-600 text-white font-bold rounded-xl text-xs shadow hover:bg-rose-700"
                            >
                                새로고침하기
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

            { id: '1-1', title: '사진', level: 2, assignee: '신부', dueDate: '2026-10-15', activeMonths: ['2026-06', '2026-07', '2026-08', '2026-09', '2026-10'], budget: 4500000, expense: '2,000,000 + 1,800,000', memo: '스튜디오 + 야외 스냅 총괄', detailMemo: '원하는 콘셉트 핀터레스트 앨범 정리 완료.', images: [], status: '진행 중' },
            { id: '1-1-1', title: '사진관', level: 3, assignee: '신부', dueDate: '2026-08-20', activeMonths: ['2026-06', '2026-07', '2026-08'], budget: 2500000, expense: '2,200,000', memo: '실내 스튜디오 계약 완료', detailMemo: '계약금 50만원 입금 완료.\n잔금은 촬영 당일 지급.', images: [], status: '완료' },
            { id: '1-1-2', title: '야외스냅', level: 3, assignee: '신랑', dueDate: '2026-09-25', activeMonths: ['2026-07', '2026-08', '2026-09'], budget: 1500000, expense: '1,600,000', memo: '제주도 야외 촬영 예약 건', detailMemo: '항공권 및 렌터카 예약 동시 확인 필요.', images: [], status: '긴급' },
            { id: '2', title: '웨딩홀 투어 및 계약', level: 1, assignee: '공동', dueDate: '2026-12-20', activeMonths: ['2026-05', '2026-06', '2026-07', '2026-08', '2026-09', '2026-10', '2026-11', '2026-12'], budget: 12000000, expense: '10,000,000 + 2,000,000', memo: '보증인원 및 피연장 계약', detailMemo: '보증인원 250명, 시식 4인 가능 쿠폰 수령.', images: [], status: '완료' }
        ];

        function safeEvaluateExpense(expr) {
            if (!expr) return 0;
            if (typeof expr === 'number') return expr;
            try {
                const clean = String(expr).replace(/[^0-9+\-*/().]/g, '');
                if (!clean) return 0;
                const evalFn = new Function(`return (${clean})`);
                const result = evalFn();
                return isNaN(result) || !isFinite(result) ? 0 : Math.max(0, result);
            } catch (e) {
                return 0;
            }
        }

        function formatWon(num) {
            const val = Math.round(Number(num) || 0);
            return val.toLocaleString('ko-KR') + '원';
        }

        function formatNumberWithCommas(str) {
            if (!str) return '';
            const cleanVal = String(str).replace(/,/g, '');
            return cleanVal.replace(/\d+/g, (match) => Number(match).toLocaleString('ko-KR'));
        }

        function compressAndConvertImage(file, callback) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1200;

                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        callback(compressedDataUrl);
                    } catch (err) {
                        console.error("Image canvas processing error:", err);
                    }
                };
                img.onerror = (err) => {
                    console.error("Image loading error:", err);
                };
                img.src = e.target.result;
            };
            reader.onerror = (err) => {
                console.error("FileReader error:", err);
            };
            reader.readAsDataURL(file);
        }

        function getHierarchyPrefix(taskIndex, allTasks) {
            const task = allTasks[taskIndex];
            const level = task ? (task.level || 1) : 1;

            let parentIndex = -1;
            for (let j = taskIndex - 1; j >= 0; j--) {
                if (allTasks[j].level < level) {
                    parentIndex = j;
                    break;
                }
            }

            let siblingCount = 0;
            for (let k = parentIndex + 1; k <= taskIndex; k++) {
                if (allTasks[k].level === level) {
                    siblingCount++;
                }
            }
            siblingCount = Math.max(1, siblingCount);

            const koreanChar = (num) => {
                const chars = ['가', '나', '다', '라', '마', '바', '사', '아', '자', '차', '카', '타', '파', '하'];
                return chars[(num - 1) % chars.length];
            };

            if (level === 1) return `${siblingCount}.`;
            if (level === 2) return `${koreanChar(siblingCount)}.`;
            if (level === 3) return `${siblingCount})`;
            if (level === 4) return `${koreanChar(siblingCount)})`;
            if (level === 5) return `(${siblingCount})`;
            if (level === 6) return `(${koreanChar(siblingCount)})`;
            return `•`;
        }

        // 특정 업무와 그 하위 업무(Sub-tasks) 전체 개수를 구하는 헬퍼 함수
        function getTaskGroupCount(taskList, startIndex) {
            if (startIndex < 0 || startIndex >= taskList.length) return 0;
            const parentLevel = taskList[startIndex].level || 1;
            let count = 1;
            for (let i = startIndex + 1; i < taskList.length; i++) {
                if ((taskList[i].level || 1) > parentLevel) {
                    count++;
                } else {
                    break;
                }
            }
            return count;
        }

        function App() {
            // LocalStorage persistence for tasks
            const [tasks, setTasksState] = useState(() => {
                try {
                    const saved = localStorage.getItem('lambs_wedding_tasks_v7');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return parsed.map(t => {
                            if (!t.activeMonths && t.startMonth && t.endMonth) {
                                const months = [];
                                let [sy, sm] = t.startMonth.split('-').map(Number);
                                let [ey, em] = t.endMonth.split('-').map(Number);
                                while (sy < ey || (sy === ey && sm <= em)) {
                                    months.push(`${sy}-${String(sm).padStart(2, '0')}`);
                                    sm++;
                                    if (sm > 12) { sm = 1; sy++; }
                                }
                                t.activeMonths = months;
                            }
                            if (!t.activeMonths) t.activeMonths = [];
                            return t;
                        });
                    }
                    return SAMPLE_TASKS;
                } catch(e) {
                    return SAMPLE_TASKS;
                }
            });

            // Undo / Redo Stacks
            const [past, setPast] = useState([]);
            const [future, setFuture] = useState([]);

            // Helper to update tasks with undo/redo history tracking
            const setTasks = useCallback((newTasksOrFn, saveHistory = true) => {
                setTasksState(prevTasks => {
                    const nextTasks = typeof newTasksOrFn === 'function' ? newTasksOrFn(prevTasks) : newTasksOrFn;
                    if (saveHistory && JSON.stringify(prevTasks) !== JSON.stringify(nextTasks)) {
                        setPast(p => [...p.slice(-49), prevTasks]); // Max 50 undo history
                        setFuture([]);
                    }
                    return nextTasks;
                });
            }, []);

            // Undo handler
            const handleUndo = useCallback(() => {
                setPast(prevPast => {
                    if (prevPast.length === 0) return prevPast;
                    const previousState = prevPast[prevPast.length - 1];
                    const newPast = prevPast.slice(0, prevPast.length - 1);

                    setTasksState(currentTasks => {
                        setFuture(prevFuture => [currentTasks, ...prevFuture]);
                        return previousState;
                    });

                    return newPast;
                });
            }, []);

            // Redo handler
            const handleRedo = useCallback(() => {
                setFuture(prevFuture => {
                    if (prevFuture.length === 0) return prevFuture;
                    const nextState = prevFuture[0];
                    const newFuture = prevFuture.slice(1);

                    setTasksState(currentTasks => {
                        setPast(prevPast => [...prevPast, currentTasks]);
                        return nextState;
                    });

                    return newFuture;
                });
            }, []);

            // Global Keyboard Shortcut Listener for Ctrl+Z and Ctrl+Shift+Z / Ctrl+Y
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                    const modifier = isMac ? e.metaKey : e.ctrlKey;

                    if (modifier && e.key.toLowerCase() === 'z') {
                        if (e.shiftKey) {
                            e.preventDefault();
                            handleRedo();
                        } else {
                            e.preventDefault();
                            handleUndo();
                        }
                    } else if (modifier && e.key.toLowerCase() === 'y') {
                        e.preventDefault();
                        handleRedo();
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleUndo, handleRedo]);

            // Column Widths State
            const [colWidths, setColWidths] = useState(() => {
                try {
                    const saved = localStorage.getItem('lambs_wedding_col_widths_v6');
                    return saved ? JSON.parse(saved) : { task: 420, budget: 140, expense: 160, memo: 320 };
                } catch(e) {
                    return { task: 420, budget: 140, expense: 160, memo: 320 };
                }
            });

            const [assignees, setAssignees] = useState(() => {
                try {
                    const saved = localStorage.getItem('lambs_wedding_assignees_v6');
                    return saved ? JSON.parse(saved) : INITIAL_ASSIGNEES;
                } catch(e) {
                    return INITIAL_ASSIGNEES;
                }
            });

            const [collapsedIds, setCollapsedIds] = useState(new Set());
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
            const [selectedTaskIds, setSelectedTaskIds] = useState(new Set());
            const [filterOnlySelected, setFilterOnlySelected] = useState(false);

            // Timeline month range
            const [startYearMonth, setStartYearMonth] = useState('2026-05');
            const [monthCount, setMonthCount] = useState(12);

            // Filters & Search
            const [filterStatus, setFilterStatus] = useState('ALL');
            const [filterAssignee, setFilterAssignee] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');

            // Popovers
            const [assigneeModalOpen, setAssigneeModalOpen] = useState(false);
            const [newAssigneeName, setNewAssigneeName] = useState('');
            const [activeAssigneeDropdown, setActiveAssigneeDropdown] = useState(null);
            const [activeStatusDropdown, setActiveStatusDropdown] = useState(null);

            // Expanded Memo & Image Modal State
            const [memoModalTaskId, setMemoModalTaskId] = useState(null);

            // Long-press Drag & Drop Reorder State
            const [pressingTaskId, setPressingTaskId] = useState(null);
            const [draggingTaskId, setDraggingTaskId] = useState(null);
            const [dragOverTaskId, setDragOverTaskId] = useState(null);
            const [dragOverPosition, setDragOverPosition] = useState('below');
            const pressTimerRef = useRef(null);

            // File Upload Ref
            const fileInputRef = useRef(null);

            // Scroll Synchronization Refs for Dual Horizontal Scroll
            const topScrollRef = useRef(null);
            const mainTableScrollRef = useRef(null);
            const isSyncingScroll = useRef(false);

            useEffect(() => {
                localStorage.setItem('lambs_wedding_col_widths_v6', JSON.stringify(colWidths));
            }, [colWidths]);

            useEffect(() => {
                localStorage.setItem('lambs_wedding_tasks_v7', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                localStorage.setItem('lambs_wedding_assignees_v6', JSON.stringify(assignees));
            }, [assignees]);

            // Synchronize top scroll bar with table matrix scroll
            const handleTopScroll = () => {
                if (isSyncingScroll.current) return;
                isSyncingScroll.current = true;
                if (mainTableScrollRef.current && topScrollRef.current) {
                    mainTableScrollRef.current.scrollLeft = topScrollRef.current.scrollLeft;
                }
                requestAnimationFrame(() => { isSyncingScroll.current = false; });
            };

            const handleMainTableScroll = () => {
                if (isSyncingScroll.current) return;
                isSyncingScroll.current = true;
                if (topScrollRef.current && mainTableScrollRef.current) {
                    topScrollRef.current.scrollLeft = mainTableScrollRef.current.scrollLeft;
                }
                requestAnimationFrame(() => { isSyncingScroll.current = false; });
            };

            const handleScrollMatrixHorizontal = (direction) => {
                if (mainTableScrollRef.current) {
                    const scrollAmount = direction === 'left' ? -400 : 400;
                    mainTableScrollRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                }
            };

            const handlePressStart = (taskId, e) => {
                if (e.button && e.button !== 0) return;
                setPressingTaskId(taskId);
                if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
                pressTimerRef.current = setTimeout(() => {
                    setDraggingTaskId(taskId);
                    setPressingTaskId(null);
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 1000);
            };

            const handlePressEnd = () => {
                if (pressTimerRef.current) {
                    clearTimeout(pressTimerRef.current);
                    pressTimerRef.current = null;
                }
                setPressingTaskId(null);
            };

            const handleRowDragStart = (e, taskId) => {
                e.dataTransfer.setData('text/plain', taskId);
                e.dataTransfer.effectAllowed = 'move';
                setDraggingTaskId(taskId);
            };

            const handleRowDragOver = (e, targetTaskId) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (targetTaskId === draggingTaskId) return;

                const targetRowElement = e.currentTarget;
                const rect = targetRowElement.getBoundingClientRect();
                const midY = rect.top + rect.height / 2;
                const position = e.clientY < midY ? 'above' : 'below';

                setDragOverTaskId(targetTaskId);
                setDragOverPosition(position);
            };

            const handleRowDrop = (e, targetTaskId) => {
                e.preventDefault();
                const draggedId = draggingTaskId || e.dataTransfer.getData('text/plain');

                if (draggedId && targetTaskId && draggedId !== targetTaskId) {
                    moveTaskRow(draggedId, targetTaskId, dragOverPosition);
                }

                setDraggingTaskId(null);
                setDragOverTaskId(null);
                setPressingTaskId(null);
            };

            const handleRowDragEnd = () => {
                setDraggingTaskId(null);
                setDragOverTaskId(null);
                setPressingTaskId(null);
            };

            // 업무와 하위 업무들 전체를 타겟 지점으로 함께 이동시키는 함수
            const moveTaskRow = (sourceId, targetId, position) => {
                setTasks(prevTasks => {
                    const sourceIndex = prevTasks.findIndex(t => t.id === sourceId);
                    const targetIndex = prevTasks.findIndex(t => t.id === targetId);

                    if (sourceIndex === -1 || targetIndex === -1) return prevTasks;

                    const sourceCount = getTaskGroupCount(prevTasks, sourceIndex);

                    // 자기 자신이나 자신의 하위 그룹 내부로 이동하는 것은 무시
                    if (targetIndex >= sourceIndex && targetIndex < sourceIndex + sourceCount) {
                        return prevTasks;
                    }

                    const newTasks = [...prevTasks];
                    // 드래그 대상 항목 및 모든 하위 항목 잘라내기
                    const sourceGroup = newTasks.splice(sourceIndex, sourceCount);

                    const newTargetIndex = newTasks.findIndex(t => t.id === targetId);
                    if (newTargetIndex === -1) return prevTasks;

                    let insertAt = newTargetIndex;
                    if (position === 'below') {
                        const targetCount = getTaskGroupCount(newTasks, newTargetIndex);
                        insertAt = newTargetIndex + targetCount;
                    }

                    newTasks.splice(insertAt, 0, ...sourceGroup);
                    return newTasks;
                });
            };

            // 위/아래 이동 버튼 클릭 시 동일 상위(Sibling) 영역 내에서 하위 업무 그룹 전체가 함께 이동
            const handleQuickMoveRow = (taskId, direction) => {
                setTasks(prevTasks => {
                    const sourceIndex = prevTasks.findIndex(t => t.id === taskId);
                    if (sourceIndex === -1) return prevTasks;

                    const sourceLevel = prevTasks[sourceIndex].level || 1;
                    const sourceCount = getTaskGroupCount(prevTasks, sourceIndex);

                    if (direction === 'up') {
                        // 동일 부모 안에서 이전 동급 업무(Sibling)의 시작 지점 찾기
                        let prevSiblingIndex = -1;
                        for (let i = sourceIndex - 1; i >= 0; i--) {
                            const lvl = prevTasks[i].level || 1;
                            if (lvl < sourceLevel) {
                                // 상위 부모 경계를 만났으므로 더 이상 위로 이동 불가능
                                break;
                            }
                            if (lvl === sourceLevel) {
                                prevSiblingIndex = i;
                                break;
                            }
                        }

                        if (prevSiblingIndex === -1) return prevTasks;

                        const newTasks = [...prevTasks];
                        const sourceGroup = newTasks.splice(sourceIndex, sourceCount);
                        newTasks.splice(prevSiblingIndex, 0, ...sourceGroup);
                        return newTasks;
                    } else {
                        // 동일 부모 안에서 다음 동급 업무(Sibling) 위치 찾기
                        const nextIndex = sourceIndex + sourceCount;
                        if (nextIndex >= prevTasks.length) return prevTasks;

                        const nextLevel = prevTasks[nextIndex].level || 1;
                        if (nextLevel < sourceLevel) {
                            // 부모 영역의 마지막이므로 아래로 이동 불가
                            return prevTasks;
                        }

                        let nextSiblingIndex = -1;
                        if (nextLevel === sourceLevel) {
                            nextSiblingIndex = nextIndex;
                        } else {
                            for (let i = nextIndex; i < prevTasks.length; i++) {
                                const lvl = prevTasks[i].level || 1;
                                if (lvl < sourceLevel) break;
                                if (lvl === sourceLevel) {
                                    nextSiblingIndex = i;
                                    break;
                                }
                            }
                        }

                        if (nextSiblingIndex === -1) return prevTasks;

                        const nextSiblingCount = getTaskGroupCount(prevTasks, nextSiblingIndex);
                        const insertAt = nextSiblingIndex + nextSiblingCount;

                        const newTasks = [...prevTasks];
                        const sourceGroup = newTasks.splice(sourceIndex, sourceCount);
                        const actualInsertAt = insertAt - sourceCount;
                        newTasks.splice(actualInsertAt, 0, ...sourceGroup);
                        return newTasks;
                    }
                });
            };

            // 현재 이동/드래그 중인 업무 그룹에 속한 task.id 집합을 구함 (시각적 강조용)
            const activeDraggedTaskIds = useMemo(() => {
                const activeId = draggingTaskId || pressingTaskId;
                if (!activeId) return new Set();
                const idx = tasks.findIndex(t => t.id === activeId);
                if (idx === -1) return new Set();
                const count = getTaskGroupCount(tasks, idx);
                const set = new Set();
                for (let i = idx; i < idx + count; i++) {
                    if (tasks[i]) set.add(tasks[i].id);
                }
                return set;
            }, [tasks, draggingTaskId, pressingTaskId]);

            const handleResizeMouseDown = (colKey, e) => {
                e.preventDefault();
                e.stopPropagation();
                const startX = e.clientX;
                const startWidth = colWidths[colKey] || 200;

                const onMouseMove = (moveEvent) => {
                    const deltaX = moveEvent.clientX - startX;
                    const minWidth = colKey === 'task' ? 240 : 100;
                    const newWidth = Math.max(minWidth, startWidth + deltaX);
                    setColWidths(prev => ({ ...prev, [colKey]: newWidth }));
                };

                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            };

            const handleResetColWidths = () => {
                setColWidths({ task: 420, budget: 140, expense: 160, memo: 320 });
            };

            const timelineMonths = useMemo(() => {
                const months = [];
                const [startYear, startMonth] = startYearMonth.split('-').map(Number);
                let currentY = startYear || 2026;
                let currentM = startMonth || 5;

                for (let i = 0; i < monthCount; i++) {
                    const formattedM = String(currentM).padStart(2, '0');
                    const key = `${currentY}-${formattedM}`;
                    months.push({
                        key,
                        year: currentY,
                        month: currentM,
                        label: `${currentM}월`,
                        fullLabel: `${currentY}년 ${currentM}월`
                    });

                    currentM++;
                    if (currentM > 12) {
                        currentM = 1;
                        currentY++;
                    }
                }
                return months;
            }, [startYearMonth, monthCount]);

            const currentYearMonthKey = useMemo(() => {
                const now = new Date();
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, '0');
                return `${y}-${m}`;
            }, []);

            const summaryData = useMemo(() => {
                let totalBudget = 0;
                let totalExpense = 0;
                let urgentCount = 0;
                let completedCount = 0;

                tasks.forEach(t => {
                    totalBudget += Number(t.budget || 0);
                    totalExpense += safeEvaluateExpense(t.expense);
                    if (t.status === '긴급') urgentCount++;
                    if (t.status === '완료') completedCount++;
                });

                const completionRate = tasks.length > 0 ? Math.round((completedCount / tasks.length) * 100) : 0;
                const remaining = totalBudget - totalExpense;

                return {
                    totalBudget,
                    totalExpense,
                    remaining,
                    urgentCount,
                    completedCount,
                    totalTasks: tasks.length,
                    completionRate
                };
            }, [tasks]);

            const activeMemoTask = useMemo(() => {
                return tasks.find(t => t.id === memoModalTaskId) || null;
            }, [tasks, memoModalTaskId]);

            const totalMatrixWidth = useMemo(() => {
                const fixedColsWidth = 42 + 45 + colWidths.task + 85 + 120 + colWidths.budget + colWidths.expense + colWidths.memo + 140;
                const timelineWidth = Math.max(300, monthCount * 42);
                return fixedColsWidth + timelineWidth;
            }, [colWidths, monthCount]);

            const toggleCollapse = (id) => {
                setCollapsedIds(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const hasChildren = useCallback((taskIndex) => {
                const currentTask = tasks[taskIndex];
                if (!currentTask) return false;
                const nextTask = tasks[taskIndex + 1];
                return nextTask && nextTask.level > currentTask.level;
            }, [tasks]);

            const isTaskHiddenByCollapse = useCallback((taskIndex) => {
                let currentTargetLevel = tasks[taskIndex].level;
                for (let i = taskIndex - 1; i >= 0; i--) {
                    const candidate = tasks[i];
                    if (candidate.level < currentTargetLevel) {
                        if (collapsedIds.has(candidate.id)) {
                            return true;
                        }
                        currentTargetLevel = candidate.level;
                        if (currentTargetLevel <= 1) {
                            break;
                        }
                    }
                }
                return false;
            }, [tasks, collapsedIds]);

            const handleSort = (key) => {
                setSortConfig(prev => {
                    if (prev.key !== key) {
                        return { key, direction: 'asc' };
                    } else if (prev.direction === 'asc') {
                        return { key, direction: 'desc' };
                    } else {
                        return { key: null, direction: 'asc' };
                    }
                });
            };

            const toggleSelectTask = (id) => {
                setSelectedTaskIds(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const handleMonthToggleGauge = (task, monthKey) => {
                const currentActive = task.activeMonths || [];
                let nextActive;
                if (currentActive.includes(monthKey)) {
                    nextActive = currentActive.filter(m => m !== monthKey);
                } else {
                    nextActive = [...currentActive, monthKey].sort();
                }
                handleUpdateTask(task.id, 'activeMonths', nextActive);
            };

            const handleAddTask = (afterId = null, defaultLevel = 1) => {
                const newTask = {
                    id: Date.now().toString(),
                    title: '새 업무 항목',
                    level: defaultLevel,
                    assignee: '공동',
                    dueDate: '',
                    activeMonths: [timelineMonths[0]?.key || '2026-05', timelineMonths[1]?.key || '2026-06'],
                    budget: 0,
                    expense: '0',
                    memo: '',
                    detailMemo: '',
                    images: [],
                    status: '시작 전'
                };

                if (!afterId) {
                    setTasks([...tasks, newTask]);
                    return;
                }

                const index = tasks.findIndex(t => t.id === afterId);
                const updated = [...tasks];
                updated.splice(index + 1, 0, newTask);
                setTasks(updated);
            };

            const handleUpdateTask = (id, field, value) => {
                setTasks(prev => prev.map(t => t.id === id ? { ...t, [field]: value } : t));
            };

            const handleDeleteTask = (id) => {
                setTasks(prev => {
                    const index = prev.findIndex(t => t.id === id);
                    if (index === -1) return prev;
                    const count = getTaskGroupCount(prev, index);
                    const newTasks = [...prev];
                    newTasks.splice(index, count);
                    return newTasks;
                });
                setSelectedTaskIds(prev => {
                    const next = new Set(prev);
                    next.delete(id);
                    return next;
                });
                if (memoModalTaskId === id) {
                    setMemoModalTaskId(null);
                }
            };

            const handleIndent = (id, direction) => {
                setTasks(prev => prev.map(t => {
                    if (t.id === id) {
                        const newLevel = direction === 'increase' ? Math.min(6, t.level + 1) : Math.max(1, t.level - 1);
                        return { ...t, level: newLevel };
                    }
                    return t;
                }));
            };

            const handleImageFilesUpload = (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length || !memoModalTaskId) return;

                files.forEach(file => {
                    if (!file.type.startsWith('image/')) return;
                    compressAndConvertImage(file, (dataUrl) => {
                        const newImageObj = {
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                            name: file.name,
                            url: dataUrl,
                            uploadedAt: new Date().toLocaleDateString('ko-KR')
                        };

                        setTasks(prev => prev.map(t => {
                            if (t.id === memoModalTaskId) {
                                const existingImages = t.images || [];
                                return { ...t, images: [...existingImages, newImageObj] };
                            }
                            return t;
                        }));
                    });
                });

                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
            };

            const handleDeleteImage = (taskId, imageId) => {
                setTasks(prev => prev.map(t => {
                    if (t.id === taskId) {
                        return { ...t, images: (t.images || []).filter(img => img.id !== imageId) };
                    }
                    return t;
                }));
            };

            const handleDeleteAssignee = (assigneeId) => {
                if (assignees.length <= 1) return;
                setAssignees(prev => prev.filter(a => a.id !== assigneeId));
                setTasks(prev => prev.map(t => t.assignee === assigneeId ? { ...t, assignee: '공동' } : t));
            };

            const handleAddAssignee = () => {
                if (!newAssigneeName.trim()) return;
                const colorOptions = [
                    'bg-purple-100 text-purple-900 border-purple-200 hover:bg-purple-200',
                    'bg-indigo-100 text-indigo-900 border-indigo-200 hover:bg-indigo-200',
                    'bg-emerald-100 text-emerald-900 border-emerald-200 hover:bg-emerald-200',
                    'bg-amber-100 text-amber-900 border-amber-200 hover:bg-amber-200',
                    'bg-rose-100 text-rose-900 border-rose-200 hover:bg-rose-200'
                ];
                const randomColor = colorOptions[Math.floor(Math.random() * colorOptions.length)];
                const newAssignee = {
                    id: newAssigneeName.trim(),
                    label: newAssigneeName.trim(),
                    bg: randomColor
                };
                setAssignees([...assignees, newAssignee]);
                setNewAssigneeName('');
                setAssigneeModalOpen(false);
            };

            const handleExportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `양들의_혼례_예식준비_${new Date().toISOString().slice(0, 10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const handleImportData = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (Array.isArray(parsed)) {
                                setTasks(parsed);
                            }
                        } catch (err) {}
                    };
                }
            };

            const handleResetData = () => {
                setTasks(SAMPLE_TASKS);
                setAssignees(INITIAL_ASSIGNEES);
                setCollapsedIds(new Set());
                setSelectedTaskIds(new Set());
                setSortConfig({ key: null, direction: 'asc' });
            };

            const displayTasks = useMemo(() => {
                let indexed = tasks.map((t, idx) => ({ task: t, originalIndex: idx }));

                indexed = indexed.filter(({ originalIndex }) => !isTaskHiddenByCollapse(originalIndex));

                indexed = indexed.filter(({ task }) => {
                    const matchesStatus = filterStatus === 'ALL' || task.status === filterStatus;
                    const matchesAssignee = filterAssignee === 'ALL' || task.assignee === filterAssignee;
                    const matchesSearch = !searchQuery || 
                        task.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                        (task.memo && task.memo.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        (task.detailMemo && task.detailMemo.toLowerCase().includes(searchQuery.toLowerCase()));
                    const matchesSelected = !filterOnlySelected || selectedTaskIds.has(task.id);
                    return matchesStatus && matchesAssignee && matchesSearch && matchesSelected;
                });

                if (sortConfig.key) {
                    indexed.sort((a, b) => {
                        let valA, valB;

                        if (sortConfig.key === 'dueDate') {
                            valA = a.task.dueDate || '9999-99-99';
                            valB = b.task.dueDate || '9999-99-99';
                        } else if (sortConfig.key === 'budget') {
                            valA = Number(a.task.budget || 0);
                            valB = Number(b.task.budget || 0);
                        } else if (sortConfig.key === 'expense') {
                            valA = safeEvaluateExpense(a.task.expense);
                            valB = safeEvaluateExpense(b.task.expense);
                        }

                        if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }

                return indexed;
            }, [tasks, filterStatus, filterAssignee, searchQuery, filterOnlySelected, selectedTaskIds, isTaskHiddenByCollapse, sortConfig]);

            return (
                <div className="h-screen flex flex-col bg-slate-50 text-slate-800 overflow-hidden w-full">
                    
                    {/* FULL-WIDTH STICKY TOP HEADER & SUMMARY DISPLAY */}
                    <div className="sticky top-0 z-40 bg-slate-50 border-b border-slate-200 shadow-md shrink-0 w-full">
                        
                        <header className="bg-gradient-to-r from-rose-900 via-wedding-700 to-amber-900 text-white px-4 sm:px-8 py-3 w-full">
                            <div className="w-full flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 bg-white/10 backdrop-blur-md rounded-xl flex items-center justify-center border border-white/20 text-xl shadow-inner">
                                        🐑
                                    </div>
                                    <div>
                                        <h1 className="text-xl sm:text-2xl font-bold tracking-tight serif-title flex items-center gap-2">
                                            양들의 혼례
                                            <span className="text-[10px] bg-rose-500/80 text-white px-2 py-0.5 rounded-full font-sans font-medium uppercase tracking-wider">
                                                Matrix Planner
                                            </span>
                                        </h1>
                                        <p className="text-[11px] text-rose-100/80 font-light hidden sm:block">
                                            예식 준비 공유 마트릭스 (Ctrl+Z 실행취소 지원)
                                        </p>
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center gap-2">
                                    {/* UNDO / REDO BUTTONS */}
                                    <div className="flex items-center bg-white/10 rounded-xl p-0.5 border border-white/20 backdrop-blur-sm mr-1">
                                        <button
                                            onClick={handleUndo}
                                            disabled={past.length === 0}
                                            className="px-2.5 py-1 rounded-lg text-xs font-medium text-white disabled:opacity-30 hover:bg-white/20 transition-all flex items-center gap-1"
                                            title="실행 취소 (Ctrl + Z)"
                                        >
                                            <Icon name="undo-2" className="w-3.5 h-3.5" />
                                            <span>실행 취소</span>
                                        </button>
                                        <div className="w-px h-4 bg-white/20 my-auto"></div>
                                        <button
                                            onClick={handleRedo}
                                            disabled={future.length === 0}
                                            className="px-2.5 py-1 rounded-lg text-xs font-medium text-white disabled:opacity-30 hover:bg-white/20 transition-all flex items-center gap-1"
                                            title="다시 실행 (Ctrl + Shift + Z / Ctrl + Y)"
                                        >
                                            <Icon name="redo-2" className="w-3.5 h-3.5" />
                                            <span>다시 실행</span>
                                        </button>
                                    </div>

                                    <button
                                        onClick={() => handleAddTask(null, 1)}
                                        className="bg-white text-wedding-700 hover:bg-rose-50 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center gap-1.5 active:scale-95"
                                    >
                                        <Icon name="plus-circle" className="w-4 h-4" />
                                        최상위 업무 추가
                                    </button>
                                    <button
                                        onClick={handleExportData}
                                        className="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-xl text-xs font-medium backdrop-blur-sm border border-white/20 transition-all flex items-center gap-1.5"
                                        title="JSON 파일로 백업 다운로드"
                                    >
                                        <Icon name="download" className="w-4 h-4" />
                                        내보내기
                                    </button>
                                    <label className="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-xl text-xs font-medium backdrop-blur-sm border border-white/20 cursor-pointer transition-all flex items-center gap-1.5">
                                        <Icon name="upload" className="w-4 h-4" />
                                        불러오기
                                        <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                                    </label>
                                    <button
                                        onClick={handleResetData}
                                        className="bg-white/10 hover:bg-rose-500/30 text-rose-200 px-2.5 py-1.5 rounded-xl text-xs font-medium backdrop-blur-sm border border-white/10 transition-all"
                                        title="초기 데이터로 복원"
                                    >
                                        <Icon name="rotate-ccw" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>

                            <div className="w-full grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
                                <div className="bg-white/10 backdrop-blur-md rounded-xl p-2.5 sm:p-3 border border-white/15">
                                    <span className="text-[11px] text-rose-100/80 block mb-0.5">총 상한 예산</span>
                                    <div className="text-base sm:text-lg font-bold text-white tracking-wide">
                                        {formatWon(summaryData.totalBudget)}
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-md rounded-xl p-2.5 sm:p-3 border border-white/15">
                                    <span className="text-[11px] text-rose-100/80 block mb-0.5">총 지출액 (실측)</span>
                                    <div className="text-base sm:text-lg font-bold text-amber-200 tracking-wide">
                                        {formatWon(summaryData.totalExpense)}
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-md rounded-xl p-2.5 sm:p-3 border border-white/15">
                                    <span className="text-[11px] text-rose-100/80 block mb-0.5">예산 잔액 (차액)</span>
                                    <div className={`text-base sm:text-lg font-bold tracking-wide ${summaryData.remaining >= 0 ? 'text-emerald-300' : 'text-rose-300'}`}>
                                        {summaryData.remaining >= 0 ? '+' : ''}{formatWon(summaryData.remaining)}
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-md rounded-xl p-2.5 sm:p-3 border border-white/15">
                                    <div className="flex justify-between items-center mb-0.5">
                                        <span className="text-[11px] text-rose-100/80">전체 진행률</span>
                                        {summaryData.urgentCount > 0 && (
                                            <span className="bg-rose-500 text-white text-[9px] px-1.5 py-0.2 rounded font-bold animate-pulse">
                                                긴급 {summaryData.urgentCount}
                                            </span>
                                        )}
                                    </div>
                                    <div className="text-base sm:text-lg font-bold text-white">
                                        {summaryData.completionRate}%
                                        <span className="text-xs font-normal text-rose-200 ml-1.5">
                                            ({summaryData.completedCount}/{summaryData.totalTasks})
                                        </span>
                                    </div>
                                    <div className="w-full bg-black/20 rounded-full h-1.5 mt-1 overflow-hidden">
                                        <div 
                                            className="bg-emerald-400 h-full rounded-full transition-all duration-500"
                                            style={{ width: `${summaryData.completionRate}%` }}
                                        ></div>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <div className="w-full p-2.5 px-4 sm:px-8 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                            <div className="flex flex-wrap items-center gap-2">
                                <div className="relative min-w-[200px]">
                                    <Icon name="search" className="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input
                                        type="text"
                                        placeholder="업무명/메모 검색..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full pl-8 pr-2.5 py-1 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-wedding-500"
                                    />
                                </div>

                                <div className="flex items-center gap-1 bg-slate-50 p-1 rounded-lg border border-slate-200 text-xs">
                                    <span className="text-slate-400 px-1 font-medium text-[11px]">상태:</span>
                                    <button
                                        onClick={() => setFilterStatus('ALL')}
                                        className={`px-2 py-0.5 rounded transition-all text-xs ${filterStatus === 'ALL' ? 'bg-white font-bold text-slate-800 shadow-2xs' : 'text-slate-500 hover:text-slate-800'}`}
                                    >
                                        전체
                                    </button>
                                    {Object.values(STATUSES).map(s => (
                                        <button
                                            key={s.id}
                                            onClick={() => setFilterStatus(s.id)}
                                            className={`px-2 py-0.5 rounded transition-all flex items-center gap-1 text-xs ${filterStatus === s.id ? 'bg-white font-bold text-slate-800 shadow-2xs' : 'text-slate-500 hover:text-slate-800'}`}
                                        >
                                            <span className={`w-1.5 h-1.5 rounded-full ${s.dot}`}></span>
                                            {s.label}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex items-center gap-1 bg-slate-50 p-1 px-2 rounded-lg border border-slate-200 text-xs">
